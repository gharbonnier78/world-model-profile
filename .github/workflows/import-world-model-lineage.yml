name: One-shot world-model lineage import
on:
  push:
    branches: ["import/world-model-lineage"]
    paths:
      - '.import/READY'
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import/world-model-lineage
          fetch-depth: 0
      - name: Reconstruct, verify, unpack and clean transport staging
        shell: bash
        run: |
          set -euo pipefail
          cat .import/source-tree.b64.part* | tr -d '[:space:]' > /tmp/world-model-source.b64
          base64 --decode /tmp/world-model-source.b64 > /tmp/world-model-source.zip
          unzip -t /tmp/world-model-source.zip
          unzip -o /tmp/world-model-source.zip -d .
          mkdir -p archive/import-bundles
          cp /tmp/world-model-source.zip archive/import-bundles/world-model-lineage-source.zip
          (cd archive/import-bundles && sha256sum world-model-lineage-source.zip > SHA256SUMS.txt)
          rm -rf .import
          rm -f .github/workflows/import-world-model-lineage.yml
      - name: Commit organised lineage to import branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'archive: import organised world-model research lineage'
          git push origin HEAD:import/world-model-lineage
