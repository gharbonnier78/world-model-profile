name: One-shot world-model lineage import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-world-model-lineage.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import/world-model-lineage
          fetch-depth: 0
      - name: Reconstruct, verify, unpack and clean transport staging
        shell: bash
        run: |
          set -euo pipefail
          cat .import/source-tree.b64.part* > /tmp/world-model-source.b64
          base64 --decode /tmp/world-model-source.b64 > /tmp/world-model-source.zip
          unzip -t /tmp/world-model-source.zip
          unzip -o /tmp/world-model-source.zip -d .
          rm -rf .import .import_text
          rm -f .github/workflows/unpack-lineage.yml
      - name: Commit organized tree to import branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'archive: import organized world-model research lineage'
          git push origin HEAD:import/world-model-lineage
