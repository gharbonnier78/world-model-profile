name: Recover world-model binary lineage

on:
  push:
    branches: ["rebuild/world-model-complete"]
    paths:
      - '.import/READY'

permissions:
  contents: write

jobs:
  recover-binaries:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/world-model-complete
          fetch-depth: 0
      - name: Reconstruct candidate tar.xz across recovery and import branches
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/world-model-binary.b64 /tmp/world-model-binary.tar.xz
          cat .recovery/tar.b64.part00 > /tmp/world-model-binary.b64
          for n in 01 02 03 04 05 06; do
            git show "origin/import/world-model-lineage:.import/source-tree.tar.xz.b64.part${n}" >> /tmp/world-model-binary.b64
          done
          tr -d '[:space:]' < /tmp/world-model-binary.b64 > /tmp/world-model-binary.clean.b64
          base64 --decode /tmp/world-model-binary.clean.b64 > /tmp/world-model-binary.tar.xz
          echo '--- reconstructed candidate ---'
          wc -c /tmp/world-model-binary.clean.b64 /tmp/world-model-binary.tar.xz
          sha256sum /tmp/world-model-binary.tar.xz
          file /tmp/world-model-binary.tar.xz
      - name: Validate XZ and inventory TAR
        shell: bash
        run: |
          set -euo pipefail
          xz -t /tmp/world-model-binary.tar.xz
          echo '--- tar inventory ---'
          tar -tJvf /tmp/world-model-binary.tar.xz
      - name: Extract binary recovery candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/world-model-binary-recovered
          mkdir -p /tmp/world-model-binary-recovered
          tar -xJf /tmp/world-model-binary.tar.xz -C /tmp/world-model-binary-recovered
          echo '--- extracted files and hashes ---'
          (cd /tmp/world-model-binary-recovered && find . -type f -print0 | sort -z | xargs -0 sha256sum)
