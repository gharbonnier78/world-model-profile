name: Rebuild world-model repository from text-core bundle

on:
  push:
    branches: ["rebuild/world-model-complete"]
    paths:
      - '.import/READY'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/world-model-complete
          fetch-depth: 0
      - name: Reconstruct and inspect transport bundle
        shell: bash
        run: |
          set -euo pipefail
          echo '--- staged parts ---'
          wc -c .import/textcore.b64.part*
          sha256sum .import/textcore.b64.part*
          cat .import/textcore.b64.part* | tr -d '[:space:]' > /tmp/world-model-textcore.b64
          base64 --decode /tmp/world-model-textcore.b64 > /tmp/world-model-textcore.zip
          echo '--- reconstructed archive ---'
          wc -c /tmp/world-model-textcore.b64 /tmp/world-model-textcore.zip
          sha256sum /tmp/world-model-textcore.zip
          file /tmp/world-model-textcore.zip
          unzip -t /tmp/world-model-textcore.zip
      - name: Stop after diagnostics
        shell: bash
        run: |
          echo 'Archive is structurally valid. No repository content modified in this diagnostic run.'
