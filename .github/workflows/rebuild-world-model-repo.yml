name: Salvage world-model binary lineage prefix

on:
  push:
    branches: ["rebuild/world-model-complete"]
    paths:
      - '.import/READY'

permissions:
  contents: write

jobs:
  salvage-binaries:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/world-model-complete
          fetch-depth: 0
      - name: Reconstruct truncated tar.xz candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .recovery/tar.b64.part00 > /tmp/world-model-binary.b64
          for n in 01 02 03 04 05 06; do
            git show "origin/import/world-model-lineage:.import/source-tree.tar.xz.b64.part${n}" >> /tmp/world-model-binary.b64
          done
          tr -d '[:space:]' < /tmp/world-model-binary.b64 > /tmp/world-model-binary.clean.b64
          base64 --decode /tmp/world-model-binary.clean.b64 > /tmp/world-model-binary.tar.xz
          wc -c /tmp/world-model-binary.tar.xz
          sha256sum /tmp/world-model-binary.tar.xz
      - name: Decompress recoverable XZ prefix
        shell: bash
        run: |
          set -u
          rm -f /tmp/world-model-binary.partial.tar
          xz -dc --ignore-check /tmp/world-model-binary.tar.xz > /tmp/world-model-binary.partial.tar || true
          echo '--- partial tar bytes ---'
          wc -c /tmp/world-model-binary.partial.tar
          file /tmp/world-model-binary.partial.tar || true
          echo '--- recoverable tar members ---'
          tar -tvf /tmp/world-model-binary.partial.tar || true
      - name: Extract recoverable complete members
        shell: bash
        run: |
          set -u
          rm -rf /tmp/binary-prefix
          mkdir -p /tmp/binary-prefix
          tar -xvf /tmp/world-model-binary.partial.tar -C /tmp/binary-prefix --ignore-zeros || true
          echo '--- extracted files ---'
          find /tmp/binary-prefix -type f -printf '%s %P\n' | sort
          echo '--- hashes ---'
          (cd /tmp/binary-prefix && find . -type f -print0 | sort -z | xargs -0 -r sha256sum) || true
