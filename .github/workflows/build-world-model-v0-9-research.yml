name: Build World Model research draft v0.9

on:
  push:
    branches:
      - research/state-sufficiency-vs-world-modelhood
    paths:
      - 'research/toy_c_v0_4/**'
      - 'history/2026-09-16_toy_c_v0_4_typed_extension.md'
      - '.github/workflows/build-world-model-v0-9-research.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/state-sufficiency-vs-world-modelhood
          fetch-depth: 0

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended

      - name: Verify exact finite evidence
        shell: bash
        run: |
          set -euo pipefail
          python research/toy_c_v0_1/verify_toy_c_v0_1.py > /tmp/toy_c_v01.json
          diff -u research/toy_c_v0_1/results_v0_1.json /tmp/toy_c_v01.json
          python research/toy_c_v0_2/verify_toy_c_v0_2.py > /tmp/toy_c_v02.json
          diff -u research/toy_c_v0_2/results_v0_2.json /tmp/toy_c_v02.json
          python research/toy_c_v0_3/verify_toy_c_v0_3.py > /tmp/toy_c_v03.json
          diff -u research/toy_c_v0_3/results_v0_3.json /tmp/toy_c_v03.json
          python research/toy_c_v0_4/verify_toy_c_v0_4.py > /tmp/toy_c_v04.json
          diff -u research/toy_c_v0_4/results_v0_4.json /tmp/toy_c_v04.json

      - name: Transform v0.8 TeX to v0.9
        shell: bash
        run: |
          set -euo pipefail
          python research/toy_c_v0_4/apply_v0_8_to_v0_9.py

      - name: Assemble v0.9 research package
        shell: bash
        run: |
          set -euo pipefail
          OLD='paper/world_model_profile_research_v0_8'
          OUT='paper/world_model_profile_research_v0_9'
          mkdir -p "$OUT"

          cp "$OLD/fig_toy_a_regret.png" "$OUT/"
          cp "$OLD/fig_rho_three_history.png" "$OUT/"
          cp "$OLD/verify_finite_separations.py" "$OUT/"
          cp "$OLD/finite_separation_results.json" "$OUT/"
          cp "$OLD/toy_a_grid.csv" "$OUT/"
          cp "$OLD/verify_supporting_diagnostics.py" "$OUT/"
          cp "$OLD/supporting_diagnostics_results.json" "$OUT/"

          for v in 1 2 3 4; do
            cp "research/toy_c_v0_${v}/TOY_C_V0_${v}_SPEC.md" "$OUT/"
            cp "research/toy_c_v0_${v}/verify_toy_c_v0_${v}.py" "$OUT/"
            cp "research/toy_c_v0_${v}/results_v0_${v}.json" "$OUT/"
          done

          cp history/2026-09-15_toy_c_state_sufficiency_chronicle.md "$OUT/CHRONICLE_2026-09-15_TOY_C_V0_1_TO_V0_3.md"
          cp history/2026-09-16_toy_c_v0_4_typed_extension.md "$OUT/CHRONICLE_2026-09-16_TOY_C_V0_4.md"

      - name: Compile PDF
        shell: bash
        run: |
          set -euo pipefail
          cd paper/world_model_profile_research_v0_9
          pdflatex -interaction=nonstopmode -halt-on-error world_model_profile_research_v0_9.tex
          pdflatex -interaction=nonstopmode -halt-on-error world_model_profile_research_v0_9.tex
          test -s world_model_profile_research_v0_9.pdf
          rm -f *.aux *.log *.out

      - name: Write package manifest
        shell: bash
        run: |
          set -euo pipefail
          OUT='paper/world_model_profile_research_v0_9'
          cat > "$OUT/README.md" <<'EOF'
          # World Model Profile — post-v0.6 research draft v0.9

          **Status:** exploratory post-publication research draft. It does not reopen the accepted v0.4 framework spine and does not rewrite the preserved v0.6 milestone or v0.7/v0.8 research snapshots.

          This package integrates Toy C v0.1-v0.4 into the manuscript and keeps the exact finite evidence beside the LaTeX/PDF.

          Key Toy C findings under falsification:

          - v0.1 separates exact current-state knowledge from possession of future-generating machinery.
          - v0.2 constructs a genuinely non-injective task-predictive quotient and weakens persistent recursive-state necessity.
          - v0.3 separates local model possession, delegated access, and finite compiled answers.
          - v0.4 shows that extension/generalisation is itself typed: Agent H is exact on `4088/4088` baseline queries and `32704/32704` longer-horizon endpoint queries, but has `0/28672` coverage on newly conditioned depth-3 histories and no branch-conditioned hypothetical-evidence interface.
          - These are finite scoped results, not a necessary-and-sufficient definition of world model.

          Reproduce the exact Toy C evidence with:

          ```bash
          python verify_toy_c_v0_1.py
          python verify_toy_c_v0_2.py
          python verify_toy_c_v0_3.py
          python verify_toy_c_v0_4.py
          ```

          The v0.9 LaTeX source is deterministically transformed from the checksum-pinned v0.8 source by `research/toy_c_v0_4/apply_v0_8_to_v0_9.py`, then compiled by the repository workflow.
          EOF

          (
            cd "$OUT"
            sha256sum \
              world_model_profile_research_v0_9.tex \
              world_model_profile_research_v0_9.pdf \
              TOY_C_V0_1_SPEC.md verify_toy_c_v0_1.py results_v0_1.json \
              TOY_C_V0_2_SPEC.md verify_toy_c_v0_2.py results_v0_2.json \
              TOY_C_V0_3_SPEC.md verify_toy_c_v0_3.py results_v0_3.json \
              TOY_C_V0_4_SPEC.md verify_toy_c_v0_4.py results_v0_4.json \
              CHRONICLE_2026-09-15_TOY_C_V0_1_TO_V0_3.md \
              CHRONICLE_2026-09-16_TOY_C_V0_4.md \
              verify_finite_separations.py finite_separation_results.json toy_a_grid.csv \
              verify_supporting_diagnostics.py supporting_diagnostics_results.json \
              fig_toy_a_regret.png fig_rho_three_history.png \
              > SHA256SUMS.txt
          )

      - name: Upload v0.9 review artifact
        uses: actions/upload-artifact@v4
        with:
          name: world-model-profile-research-v0-9
          path: paper/world_model_profile_research_v0_9
          if-no-files-found: error

      - name: Commit generated v0.9 package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/world_model_profile_research_v0_9
          git diff --cached --quiet && exit 0
          git commit -m 'paper: build post-v0.6 research draft v0.9 with Toy C v0.4'
          git push origin HEAD:research/state-sufficiency-vs-world-modelhood
